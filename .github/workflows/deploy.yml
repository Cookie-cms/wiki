name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
  
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
  
      - name: Setup Pages
        uses: actions/configure-pages@v4
  
      - name: Install dependencies
        run: npm ci
  
      - name: Build with VitePress
        # Assuming npm run docs:build runs the build process correctly
        # and that the output directory is correctly configured relative to the root.
        run: npm run docs:build
  
      # The problem was likely here: the path should be relative to the repository root.
      # If your .vitepress folder is in the root, the output folder is .vitepress/dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # CORRECTED PATH: Removed 'docs/' prefix, assuming .vitepress is in the repository root.
          path: .vitepress/dist 
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
